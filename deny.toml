[advisories]
# cargo-deny 0.19: vulnerability advisories deny unconditionally, but
# `unmaintained` and `unsound` are SCOPES, not booleans — both default to
# "workspace", meaning they only fail for *direct* workspace dependencies. A
# transitive unsound advisory therefore passes silently here (verified on this
# tree, LAB-1128: rand 0.8.5 / RUSTSEC-2026-0097, reached via fred and memcache,
# is not reported). CI pairs this file with `cargo audit`, which reads the
# lockfile verbatim, to cover that blind spot — .github/workflows/security.yml.
# yanked: warn instead of hard-fail so renovate can fix.
yanked = "warn"
unmaintained = "workspace"  # explicit, though it is also the default

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# This SDK is rustls-only: openssl/native-tls must never re-enter the graph.
# (async-memcached 0.6 once dragged them in via a toxiproxy_rust runtime dep —
# expert panel, LAB-429. toxiproxy is a fault-injection *test* proxy; banned
# outright so no future dependency smuggles it back as a runtime edge.)
deny = [
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "toxiproxy_rust" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
