[workspace]
resolver = "2"
members = ["crates/cachekit", "crates/cachekit-macros"]

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/cachekit-io/cachekit-rs"

# Exact, so each cachekit-rs release only ever meets the macros released with
# it (README: "Why cachekit-macros is pinned exactly"). Declared here because
# release-please rewrites a member manifest's dependency version to a bare one,
# dropping the `=`; the marker has the release bump only the number instead
# (`extra-files` in release-please-config.json).
[workspace.dependencies]
cachekit-macros = { version = "=0.13.1", path = "crates/cachekit-macros" } # x-release-please-version

# ── Workspace lints ──────────────────────────────────────────────────────────
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Pedantic — cherry-picked for value
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
needless_pass_by_value = "warn"
uninlined_format_args = "warn"
unused_self = "warn"

# Restriction — cherry-picked for safety
# Note: unwrap_used/expect_used/panic are set in lib.rs via #![warn(...)]
# to avoid firing in test code (allow-unwrap-in-tests has compatibility issues).
dbg_macro = "deny"
print_stdout = "warn"
todo = "warn"
