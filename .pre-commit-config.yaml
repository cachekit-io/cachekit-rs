# Pre-commit hooks for cachekit-rs
# Install: pre-commit install
# Run manually: pre-commit run --all-files

default_install_hook_types: [pre-commit, commit-msg]
# Hooks with no `stages` run at commit and push, never on the commit message.
default_stages: [pre-commit, pre-push]

repos:
  # Rust formatting and linting
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Cargo format
        entry: cargo fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: Cargo clippy
        entry: make clippy
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-test
        name: Cargo test
        entry: make test
        language: system
        files: \.rs$
        pass_filenames: false
        stages: [pre-push]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0  # pragma: allowlist secret
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict

  # Secret scanning - prevent credential leaks
  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # v1.5.0  # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
        exclude: |
          (?x)^(
            .*\.lock$|
            target/.*|
            tests/fixtures/.*|
            crates/cachekit/tests/vectors/.*
          )$

  # Keeps internal references (ticket ids, secret-store paths, internal hosts and process
  # names) out of user-facing docs and commit messages. The patterns are generic on purpose:
  # a list of specific internal names would itself disclose them.
  # Scope rule: https://docs.cachekit.io/contributing/#what-belongs-in-these-docs
  - repo: local
    hooks:
      - id: no-internal-references
        name: No internal references in docs
        language: pygrep
        entry: '\b(?i:LAB)-[0-9]+|op://|\.ts\.net|(?i:\bk3s[\s_-]+(?:cluster|node|host)s?\b)|dev\.cachekit\.io|\bStage [0-9]|\bAC-[0-9]|github\.com/cachekit(?![\w-])'
        files: ^((packages|crates)/[^/]+/)?README[^/]*$|^docs/
        types: [text]
        # Whole-file search, so a phrase wrapped across two lines still matches.
        args: [--multiline]
        stages: [pre-commit]
      - id: no-internal-references-commit-msg
        name: No internal references in commit message
        # Same patterns, over the text git will commit. git hands this hook the raw message file
        # and cleans it afterwards, so the hook skips only what git itself wrote and will drop.
        language: python
        entry: python -c
        args:
          - |
            import os, re, subprocess, sys
            P = re.compile(r"\b(?i:LAB)-[0-9]+|op://|\.ts\.net|(?i:\bk3s[\s_-]+(?:cluster|node|host)s?\b)|dev\.cachekit\.io|\bStage [0-9]|\bAC-[0-9]|github\.com/cachekit(?![\w-])")
            KIND = r"(?:branch|branches|remote-tracking branch|remote-tracking branches|tag|tags|commit|commits)"
            GIT_SUBJECT = re.compile(rf"Merge {KIND} '[^']*'(?:(?:, |; | and ){KIND}? ?'[^']*')*(?: of \S+)?(?: into \S+)?|(?:Revert|Reapply) \".*\"")
            CUT = "# ------------------------ >8 ------------------------"
            COMMENT = re.compile(r"#(?:[ \t]|$)")
            try:
                with open(sys.argv[1], encoding="utf-8", errors="replace") as f:
                    lines = f.read().splitlines()
            except OSError as e:
                sys.exit(f"{sys.argv[1]}: cannot read the commit message: {e}")
            # git sets GIT_EDITOR=: for this hook when no editor ran (-m, -F, --no-edit). Then git keeps
            # "#" lines and writes no scissors line, so everything is checked.
            if os.environ.get("GIT_EDITOR") != ":":
                # git cuts at a scissors line it wrote itself, which only "#" lines and the
                # `commit -v` diff follow. Text typed below a pasted one is kept, so it is checked.
                if CUT in lines:
                    cut = lines.index(CUT)
                    below = lines[cut + 1:]
                    end = next((i for i, line in enumerate(below) if line.startswith("diff --git ")), len(below))
                    if all(not line.strip() or COMMENT.match(line) for line in below[:end]):
                        lines = lines[:cut]
                lines = [line for line in lines if not COMMENT.match(line)]
            lines = [line for line in lines if line.strip()]
            # A merge or revert in progress writes a subject quoting branch names or an earlier subject.
            state = subprocess.run(["git", "rev-parse", "--git-path", "MERGE_HEAD", "--git-path", "REVERT_HEAD"],
                                   capture_output=True, text=True).stdout.splitlines()
            if lines and GIT_SUBJECT.fullmatch(lines[0]) and any(os.path.exists(p) for p in state):
                lines = lines[1:]
            # Joined, so a phrase wrapped across two lines still matches.
            body = "\n".join(lines)
            bad = sorted({body.count("\n", 0, m.start()) for m in P.finditer(body)})
            for i in bad:
                print(f"{sys.argv[1]}: {lines[i]}")
            sys.exit(1 if bad else 0)
        stages: [commit-msg]
