# Pre-commit hooks for cachekit-rs
# Install: pre-commit install
# Run manually: pre-commit run --all-files

default_install_hook_types: [pre-commit, commit-msg]
# Hooks with no `stages` run at commit and push, never on the commit message.
default_stages: [pre-commit, pre-push]

repos:
  # Rust formatting and linting
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Cargo format
        entry: cargo fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: Cargo clippy
        entry: make clippy
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-test
        name: Cargo test
        entry: make test
        language: system
        files: \.rs$
        pass_filenames: false
        stages: [pre-push]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0  # pragma: allowlist secret
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict

  # Secret scanning - prevent credential leaks
  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # v1.5.0  # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
        exclude: |
          (?x)^(
            .*\.lock$|
            target/.*|
            tests/fixtures/.*|
            crates/cachekit/tests/vectors/.*
          )$

  # Keeps internal references (ticket ids, secret-store paths, internal hosts and process
  # names) out of user-facing docs and commit messages. The patterns are generic on purpose:
  # a list of specific internal names would itself disclose them.
  # Scope rule: https://docs.cachekit.io/contributing/#what-belongs-in-these-docs
  - repo: local
    hooks:
      - id: no-internal-references
        name: No internal references in docs
        language: pygrep
        entry: 'LAB-[0-9]+|op://|\.ts\.net|\bk3s\b|dev\.cachekit\.io|\bStage [0-9]|\bAC-[0-9]|github\.com/cachekit(?![\w-])'
        files: ^(packages/[^/]+/)?README[^/]*$|^docs/
        types: [text]
        stages: [pre-commit]
      - id: no-internal-references-commit-msg
        name: No internal references in commit message
        language: pygrep
        # Same patterns, skipping git's "#" comment lines, which quote the branch name.
        entry: '^(?!#).*?(?:LAB-[0-9]+|op://|\.ts\.net|\bk3s\b|dev\.cachekit\.io|\bStage [0-9]|\bAC-[0-9]|github\.com/cachekit(?![\w-]))'
        stages: [commit-msg]
