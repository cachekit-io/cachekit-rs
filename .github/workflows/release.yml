name: Release

on:
  push:
    branches:
      - main
  # Break-glass republish: dispatch when a release got tagged but the crates.io
  # publish never ran (the v0.4.0 run died before the publish job).
  # The required tag input pins WHAT gets published: main can drift past an
  # unpublished tag within hours (it did for v0.4.0), and publishing main HEAD
  # would package that drift under the tagged version. `verify` accepts only
  # the release commit of a version newer than any on crates.io, so a
  # dispatch of an already-published version fails there, before publish.
  workflow_dispatch:
    inputs:
      tag:
        description: "Unpublished release tag newer than crates.io (cachekit-rs-vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# Serialise release runs so a manual dispatch can't race a push-triggered
# publish into two concurrent cargo publish attempts. Never cancel an
# in-flight publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['crates/cachekit--release_created'] }}
      tag_name: ${{ steps.release.outputs['crates/cachekit--tag_name'] }}
      macros_release_created: ${{ steps.release.outputs['crates/cachekit-macros--release_created'] }}
    steps:
      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@c3fc4de07084f75a2b61a5b933069bda6edf3d5c # v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Debug release-please outputs
        # env indirection, never inline ${{ }} in run: the outputs embed
        # changelog prose, and one apostrophe in it terminates a single-quoted
        # shell string — that exit 127 killed the job before `publish` on
        # every push since 2026-07-22, orphaning the v0.4.0 release.
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: echo "$RELEASE_OUTPUTS"

      - name: Assign release PR to 27Bslash6
        # REST instead of `gh pr edit --add-assignee`: gh's assignee edit goes
        # through GraphQL mutations that 403 with app installation tokens
        # (cli/cli#6274, replaceActorsForAssignable). The assignees REST
        # endpoint works with the PR-write permission the app token has.
        if: ${{ steps.release.outputs.pr }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/issues/${{ fromJson(steps.release.outputs.pr).number }}/assignees" \
            -f "assignees[]=27Bslash6"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # The untrusted-code half of a release. Tests, the MSRV check and the
  # verifying package build run dependency build scripts and proc-macros, so
  # they run here, with no id-token and no crates.io token. `publish` below
  # runs no dependency code.
  verify:
    needs: release-please
    # Same gate as `publish`: an automated release, or a manual dispatch from
    # main (workflow_dispatch can fire from any ref; requiring main stops a
    # feature branch from driving a publish) — the required tag input alone
    # decides what content ships.
    if: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # On dispatch, build and publish the tag's content — never main HEAD.
          # inputs.tag is empty on push events, so github.sha keeps the default
          # checkout behaviour there.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          # Full history, so the dispatch check below can see main.
          fetch-depth: 0
          persist-credentials: false

      # The `release` environment admits main only, but inputs.tag can name
      # any tag. On dispatch, accept only the release commit of a version
      # newer than any on crates.io: tag cachekit-rs-v<version> is on main, its
      # commit sets both crates to <version> and its parent does not, and
      # <version> is newer than every cachekit-rs version on crates.io, yanked
      # ones included. Runs before any dependency code. The checkout above
      # already resolved refs/tags/<tag>, so HEAD is the tag's commit. python3
      # runs in isolated mode (-I): it never imports from the checkout.
      - name: Check the dispatched tag is the release commit of a version newer than crates.io
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=${TAG#cachekit-rs-v}
          if [ "$version" = "$TAG" ] || ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be cachekit-rs-v<major>.<minor>.<patch>, got '$TAG'"; exit 1
          fi
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "::error::tag '$TAG' is not on main"; exit 1; }

          # The [package] version of crates/<dir>/Cargo.toml at <commit>.
          manifest_version() {
            local toml
            toml=$(git show "$1:crates/$2/Cargo.toml") || return 1
            python3 -I -c 'import sys, tomllib; v = tomllib.loads(sys.stdin.read())["package"]["version"]; print(v) if isinstance(v, str) else sys.exit("not a literal version")' <<<"$toml"
          }
          for crate in cachekit cachekit-macros; do
            at_tag=$(manifest_version HEAD "$crate") || {
              echo "::error::cannot read the crates/$crate version at '$TAG'"; exit 1; }
            if [ "$at_tag" != "$version" ]; then
              echo "::error::tag '$TAG' names $version, but crates/$crate is $at_tag at that commit"; exit 1
            fi
            at_parent=$(manifest_version HEAD^ "$crate") || {
              echo "::error::cannot read the crates/$crate version at the parent of '$TAG'"; exit 1; }
            if [ "$at_parent" = "$version" ]; then
              echo "::error::'$TAG' is not the commit that set crates/$crate to $version"; exit 1
            fi
          done

          # The sparse index lists every published version, yanked ones too.
          # Ranked in SemVer order, where a prerelease sits below its release.
          index=$(curl -sSf --connect-timeout 10 --max-time 60 --retry 5 --retry-all-errors --retry-delay 10 \
            https://index.crates.io/ca/ch/cachekit-rs) || {
            echo "::error::cannot read the cachekit-rs crates.io index"; exit 1; }
          python3 -I -c '
          import json, re, sys
          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)
          def rank(v):
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?", v) if isinstance(v, str) else None
              if not m:
                  fail(f"the cachekit-rs crates.io index lists {v!r}, which is not a SemVer version")
              return int(m[1]), int(m[2]), int(m[3]), m[4] is None
          try:
              published = [json.loads(line)["vers"] for line in sys.stdin.read().splitlines() if line.strip()]
          except (ValueError, KeyError, TypeError):
              fail("the cachekit-rs crates.io index is not valid")
          if not published:
              fail("the cachekit-rs crates.io index lists no versions")
          version, newest = sys.argv[1], max(published, key=rank)
          if rank(version) <= rank(newest):
              fail(f"{version} is not newer than {newest}, the newest cachekit-rs on crates.io")
          print(f"{sys.argv[2]} is the release commit of {version}; crates.io newest is {newest}")
          ' "$version" "$TAG" <<<"$index"

      # `sbom` and `publish` check out the same ref and fail unless they get
      # this commit, so a tag moved mid-run cannot change what ships.
      - name: Record the tested commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run tests before publish
        run: cargo test --locked --features "cachekitio,redis,encryption,l1,macros"

      - name: Verify MSRV (1.85) before publish
        # Gate: never ship a release that breaks the declared MSRV floor.
        # release.yml previously built `stable` only, so a red MSRV job could
        # publish silently (issue #25). `check --all-targets` catches any use
        # of a newer-than-1.85 API across lib + tests without a heavy build.
        run: |
          rustup toolchain install 1.85 --profile minimal
          cargo +1.85 check --locked --all-targets --features "cachekitio,redis,encryption,l1,macros"

      - name: Package and verify both crates
        # Multi-package mode resolves cachekit-rs's dependency on the not yet
        # published cachekit-macros version through a local overlay, then
        # builds each packaged crate — the build `publish` skips with
        # --no-verify.
        run: cargo package --locked -p cachekit-macros -p cachekit-rs

  # cargo-sbom only reads `cargo metadata`, so this job builds nothing from the
  # project: no dependency build script can rewrite an SBOM before upload.
  sbom:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # `publish` downloads this exact upload and checks these digests, so an
    # artifact replaced later in the run is refused rather than attested.
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      macros-sha256: ${{ steps.sboms.outputs.macros-sha256 }}
      rs-sha256: ${{ steps.sboms.outputs.rs-sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      # `verify` ran dependency code, so its output is a claim, not a source:
      # check out the ref `verify` did and require the commit it reports. A
      # moved tag or a forged output fails here instead of shipping.
      - name: Check this is the commit verify tested
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$VERIFIED_SHA" ]; then
            echo "::error::checked out $head, but verify tested '$VERIFIED_SHA'. Either the tag moved after verify or verify's output was altered: find out which before dispatching again."
            exit 1
          fi

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-sbom
        run: cargo install cargo-sbom --version 0.10.0 --locked

      - name: Generate SBOMs
        id: sboms
        # One CycloneDX SBOM per crate, so each .crate's SBOM attestation
        # lists that crate's own dependency graph. An empty SBOM fails the
        # release: attesting it would claim a dependency-free crate.
        run: |
          for crate in cachekit-macros cachekit-rs; do
            cargo sbom --cargo-package "$crate" --output-format cyclone_dx_json_1_6 > "sbom-$crate.cdx.json"
            count=$(jq -e '.components | length' "sbom-$crate.cdx.json") || {
              echo "::error::$crate SBOM is empty or not JSON"; exit 1; }
            echo "$crate SBOM components: $count"
            if [ "${count:-0}" -lt 1 ]; then
              echo "::error::$crate SBOM lists no components"
              exit 1
            fi
          done
          echo "macros-sha256=$(sha256sum sbom-cachekit-macros.cdx.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "rs-sha256=$(sha256sum sbom-cachekit-rs.cdx.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: sbom
          path: sbom-*.cdx.json
          if-no-files-found: error

  publish:
    # With no status function in `if:`, GitHub adds an implicit success(), so
    # a failed or skipped verify or sbom skips the publish.
    needs: [release-please, verify, sbom]
    if: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # crates.io trusted publishing matches owner, repository, workflow file
    # and this environment, never the branch; the environment's deployment
    # branch policy admits main alone.
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # This job can mint a crates.io publish token, so nothing runs here that
      # doesn't need it: no dependency code (verification happened in
      # `verify`), no Swatinem/rust-cache, and no third-party action besides
      # rust-lang/crates-io-auth-action, which mints the token. The rest are
      # first-party actions/*.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      # `verify` ran dependency code, so its output is a claim, not a source:
      # check out the ref `verify` did and require the commit it reports. A
      # moved tag or a forged output fails here instead of shipping.
      - name: Check this is the commit verify tested
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$VERIFIED_SHA" ]; then
            echo "::error::checked out $head, but verify tested '$VERIFIED_SHA'. Either the tag moved after verify or verify's output was altered: find out which before dispatching again."
            exit 1
          fi

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Package both crates
        # --no-verify: packaging alone runs no dependency code. cargo packages
        # deterministically, so these are the bytes `cargo publish` uploads
        # below — the check after publishing proves it against crates.io.
        run: |
          cargo package --locked --no-verify -p cachekit-macros -p cachekit-rs
          (cd target/package && sha256sum -- *.crate) > "$RUNNER_TEMP/attested.sha256"
          cat "$RUNNER_TEMP/attested.sha256"

      # Into runner.temp, never the checkout: cargo refuses to package or
      # publish a tree with untracked files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sbom.outputs.artifact-id }}
          path: ${{ runner.temp }}/sbom

      - name: Check the SBOMs are the ones `sbom` generated
        env:
          MACROS_SHA256: ${{ needs.sbom.outputs.macros-sha256 }}
          RS_SHA256: ${{ needs.sbom.outputs.rs-sha256 }}
        run: |
          cd "$RUNNER_TEMP/sbom"
          printf '%s  %s\n' \
            "$MACROS_SHA256" sbom-cachekit-macros.cdx.json \
            "$RS_SHA256" sbom-cachekit-rs.cdx.json | sha256sum --strict -c

      # Attest before publishing: a crates.io upload is irreversible, so a
      # Sigstore outage blocks the release instead of shipping it unattested.
      # On a dispatch of a tag whose commit main has moved past, this
      # provenance names the workflow's commit on main, not the tag's. The
      # packaged commit is still bound to the attested digest: cargo records it
      # in each crate's .cargo_vcs_info.json, and verify checked that it is the
      # release commit, on main, of a version newer than any on crates.io.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/*.crate

      - name: Attest cachekit-macros SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: target/package/cachekit-macros-*.crate
          sbom-path: ${{ runner.temp }}/sbom/sbom-cachekit-macros.cdx.json

      - name: Attest cachekit-rs SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: target/package/cachekit-rs-*.crate
          sbom-path: ${{ runner.temp }}/sbom/sbom-cachekit-rs.cdx.json

      - name: Get crates.io token
        # Exchanges this job's OIDC token for a 30-minute crates.io token; the
        # action's post step revokes it when the job ends.
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish cachekit-macros to crates.io
        # Known gap: after a PARTIAL failure (macros uploaded, cachekit-rs not),
        # a redundant dispatch still dies here on the macros duplicate — publish
        # the missing crate manually in that case.
        run: cargo publish --locked --no-verify -p cachekit-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish cachekit-rs to crates.io
        run: cargo publish --locked --no-verify -p cachekit-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Check the uploaded crates are the attested files
        # Downloads what crates.io now serves and compares it with the digests
        # the attestations name. A mismatch means the attestations cover a
        # file nobody can download. The crates are already live and a version
        # cannot be re-uploaded, so a re-run cannot repair it: release a
        # patch, then yank the version. This step makes the mismatch loud.
        run: |
          mkdir "$RUNNER_TEMP/uploaded"
          for crate in cachekit-macros cachekit-rs; do
            for path in target/package/"$crate"-[0-9]*.crate; do
              file=${path##*/}
              curl -sSf --connect-timeout 10 --max-time 60 --retry 5 --retry-all-errors --retry-delay 10 \
                -o "$RUNNER_TEMP/uploaded/$file" "https://static.crates.io/crates/$crate/$file"
            done
          done
          cd "$RUNNER_TEMP/uploaded"
          if ! sha256sum --strict -c ../attested.sha256; then
            echo "::error::crates.io serves a .crate that differs from the attested file. The version is live and cannot be re-uploaded: do not re-run. Release a patch, then yank the version."
            exit 1
          fi
