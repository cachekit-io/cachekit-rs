name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard-hosted-runners:
    name: guard — no self-hosted runner labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Fail if any workflow still targets the retired self-hosted pool
        # Drift protection for maintainers only, NOT a fork-PR control — a
        # fork PR runs its own copy of this workflow file, so this check
        # cannot stop an attacker's fork from restoring `runs-on: cachekit`.
        # The control that actually blocks that is server-side: stage 2 of
        # LAB-1161 moves both scale sets into the `cachekit-private` runner
        # group, which excludes public repos. This job only stops a
        # maintainer from accidentally merging the drift back in.
        #
        # Parsed with yq, not a line-oriented grep: `runs-on:` (and
        # matrix.os/matrix.runner) are equally valid as a scalar, a
        # flow-list (`[self-hosted, cachekit]`), or a block-list (`- cachekit`
        # on its own line) — a grep anchored on the `runs-on:` line only
        # catches the first form and silently misses the other two.
        run: |
          yq --version
          bad=0
          for f in .github/workflows/*.yml; do
            hits=$(yq eval '(.jobs[].runs-on, .jobs[].strategy.matrix.os[]?, .jobs[].strategy.matrix.runner[]?)' "$f" \
              | grep -oE '\b(cachekit(-lean)?|self-hosted)\b' || true)
            if [ -n "$hits" ]; then
              echo "::error::$f still targets a self-hosted runner label: $(echo "$hits" | tr '\n' ' ')"
              bad=1
            fi
          done
          if [ "$bad" -eq 1 ]; then
            exit 1
          fi

  test:
    name: ${{ matrix.rust }}
    runs-on: ubuntu-latest
    # Fail fast rather than waiting out a hung build — a healthy cold build
    # of this tree finishes well inside this window on a hosted runner.
    timeout-minutes: 20
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85", stable, beta]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: ${{ matrix.rust }}

      - name: Check formatting
        if: matrix.rust != '1.85'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.rust != '1.85'
        run: cargo clippy --all-targets --features "cachekitio,redis,encryption,l1,macros,memcached,file" -- -D warnings

      - name: Run tests
        run: cargo test --features "cachekitio,redis,encryption,l1,macros,memcached,file"

  redis-lock:
    name: redis lock integration
    # GitHub-hosted runners have Docker preinstalled, so `services:` works
    # unchanged here — no dind sidecar required. Without a live redis the
    # lock acquire/release path has zero automated coverage — the
    # redis_lock_live_semantics test skips when CACHEKIT_TEST_REDIS_URL is
    # unset (LAB-426: the AC requires locking exercised against a container).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        # Digest-pinned like the SHA-pinned actions in this file — a bare
        # tag is mutable. redis:7 resolved 2026-07-23.
        image: redis:7@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # This job never pushes; don't leave the token in the git config
          # (zizmor: artipacked).
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Run redis lock integration test
        env:
          # The job container shares a network namespace with the redis
          # service container, so the mapped port is reachable on localhost.
          # redis-only, no default features — leanest build.
          CACHEKIT_TEST_REDIS_URL: redis://localhost:6379
        run: |
          cargo test --no-default-features --features redis --test redis_tests -- --nocapture 2>&1 | tee redis-test.log
          # False-green guard: this job exists so the live lock test actually
          # runs. If it silently skipped (env not seen), fail loudly instead of
          # reporting a hollow green — the exact defect LAB-426 is fixing.
          if grep -q "skipping redis_lock_live_semantics" redis-test.log; then
            echo "::error::redis lock test skipped — CACHEKIT_TEST_REDIS_URL not seen by the test"
            exit 1
          fi

  memcached:
    name: memcached integration
    # Same reasoning as redis-lock: hosted runners have Docker built in, so
    # `services:` needs no dind sidecar. Without a live memcached the
    # get/set/delete/ttl path has zero automated coverage — the
    # memcached_live_semantics test skips when CACHEKIT_TEST_MEMCACHED_URL is
    # unset (LAB-429: the AC requires memcached exercised against a container).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      memcached:
        # Digest-pinned like the redis service above — a bare tag is mutable.
        # memcached:1.6-alpine resolved 2026-07-24.
        image: memcached:1.6-alpine@sha256:c29847751abb41f4c268c84fb3087fee05d4edcbda44409ccb5086e26148e8a7
        ports:
          - 11211:11211
        options: >-
          --health-cmd "nc -z 127.0.0.1 11211"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # This job never pushes; don't leave the token in the git config
          # (zizmor: artipacked).
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Run memcached integration test
        env:
          # The job container shares a network namespace with the memcached
          # service container, so the mapped port is reachable on localhost.
          # memcached-only, no default features — leanest build.
          CACHEKIT_TEST_MEMCACHED_URL: tcp://localhost:11211
        run: |
          cargo test --no-default-features --features memcached --test memcached_tests -- --nocapture 2>&1 | tee memcached-test.log
          # False-green guard: this job exists so the live test actually runs.
          # If it silently skipped (env not seen), fail loudly instead of
          # reporting a hollow green.
          if grep -q "skipping memcached_live_semantics" memcached-test.log; then
            echo "::error::memcached live test skipped — CACHEKIT_TEST_MEMCACHED_URL not seen by the test"
            exit 1
          fi

  wasm:
    name: wasm32 check + runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Must equal the wasm-bindgen version in Cargo.lock — the test runner
      # binary and the crate share a private ABI and mismatches refuse to run.
      # Bump this, the sha256 below, and the Cargo.lock pin together (LAB-1079).
      WASM_BINDGEN_VERSION: "0.2.121"
      # Public release-tarball checksum, not a credential.
      WASM_BINDGEN_SHA256: "3039f38f65fe237b640cf06a140c919ca8d717ec5012146d145d3f27bb4d6b28" # pragma: allowlist secret
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Check wasm32 build
        run: cargo check -p cachekit-rs --target wasm32-unknown-unknown --features workers,encryption --no-default-features

      # ── wasm32 runtime tests ────────────────────────────────────────────────
      # Compile-only coverage shipped a runtime trap (SystemTime::now() panics
      # on wasm32) in five consecutive releases — LAB-1079. The steps below
      # actually EXECUTE the session/fetch path in a wasm runtime.

      - name: Guard wasm-bindgen lockfile drift
        run: |
          locked=$(cargo pkgid wasm-bindgen | sed 's/.*[@#]//')
          if [ "$locked" != "$WASM_BINDGEN_VERSION" ]; then
            echo "::error::Cargo.lock has wasm-bindgen $locked but this job pins the $WASM_BINDGEN_VERSION test runner. Update WASM_BINDGEN_VERSION + WASM_BINDGEN_SHA256 in ci.yml (and the wasm-bindgen-test pin in crates/cachekit/Cargo.toml) in the same PR."
            exit 1
          fi

      - name: Install Node (wasm-bindgen-test-runner host)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install wasm-bindgen-test-runner
        run: |
          curl -sSfL --retry 3 -o /tmp/wbg.tar.gz \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  /tmp/wbg.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wbg.tar.gz -C /tmp
          mkdir -p "$HOME/.wbg-bin"
          install -m 0755 "/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen-test-runner" "$HOME/.wbg-bin/"
          echo "$HOME/.wbg-bin" >> "$GITHUB_PATH"

      - name: Run wasm32 runtime tests
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        # Consumer feature set (bluesky-thinking hotpath) — workers + cachekitio
        # + encryption + macros, no defaults. --test wasm_session_tests: the
        # native integration tests in tests/ don't build for wasm32.
        run: cargo test -p cachekit-rs --target wasm32-unknown-unknown --no-default-features --features workers,cachekitio,encryption,macros --test wasm_session_tests
