name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard-hosted-runners:
    name: runs-on is a GitHub-hosted label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Fail unless every runs-on is a GitHub-hosted label
        # Maintainer drift check only; not a fork-PR security control.
        run: |
          q='.jobs[].runs-on | select((tag == "!!str" and test("^(ubuntu|macos|windows)-latest$")) | not)
             | "::error::runs-on is not a GitHub-hosted label: " + filename + ": " + tostring'
          bad=$(yq -N "$q" .github/workflows/*.y*ml)
          [ -z "$bad" ] || { echo "$bad"; exit 1; }

  test:
    name: ${{ matrix.label || matrix.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # "1.91" is the rust-version floor from Cargo.toml. New releases
          # support stable Rust: when a dependency needs a newer toolchain,
          # raise rust-version, this entry, the clippy.toml msrv values and
          # release.yml's MSRV gate together instead of holding it back.
          # The label keeps the job name ("msrv", a required check) free of
          # the version, so a raise changes no branch rule.
          - rust: "1.91"
            label: msrv
          - rust: stable
          - rust: beta
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Check formatting
        if: matrix.label != 'msrv'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.label != 'msrv'
        run: cargo clippy --all-targets --features "cachekitio,redis,encryption,l1,macros,memcached,file,tracing" -- -D warnings

      - name: Run tests
        run: cargo test --features "cachekitio,redis,encryption,l1,macros,memcached,file,tracing"

  redis-lock:
    name: redis lock integration
    # Without a live redis the lock acquire/release path has zero automated
    # coverage — the redis_lock_live_semantics test skips when
    # CACHEKIT_TEST_REDIS_URL is unset, and locking must be exercised against a container.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        # Digest-pinned like the SHA-pinned actions in this file — a bare
        # tag is mutable. redis:7 resolved 2026-07-23.
        image: redis:7@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # This job never pushes; don't leave the token in the git config
          # (zizmor: artipacked).
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Run redis lock integration test
        env:
          # redis-only, no default features — leanest build.
          CACHEKIT_TEST_REDIS_URL: redis://localhost:6379
        # Explicit `shell: bash` adds -o pipefail, so `| tee` can't mask a
        # failing test.
        shell: bash
        run: |
          cargo test --no-default-features --features redis --test redis_tests -- --nocapture 2>&1 | tee redis-test.log
          # False-green guard: this job exists so the live lock test actually
          # runs. If it silently skipped (env not seen), fail loudly instead of
          # reporting a hollow green — the exact defect this job was added to fix.
          if grep -q "skipping redis_lock_live_semantics" redis-test.log; then
            echo "::error::redis lock test skipped — CACHEKIT_TEST_REDIS_URL not seen by the test"
            exit 1
          fi

  memcached:
    name: memcached integration
    # Without a live memcached the get/set/delete/ttl path has zero automated
    # coverage — the memcached_live_semantics test skips when
    # CACHEKIT_TEST_MEMCACHED_URL is unset, and memcached must be exercised against a container.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      memcached:
        # Digest-pinned like the redis service above — a bare tag is mutable.
        # memcached:1.6-alpine resolved 2026-07-24.
        image: memcached:1.6-alpine@sha256:c29847751abb41f4c268c84fb3087fee05d4edcbda44409ccb5086e26148e8a7
        ports:
          - 11211:11211
        options: >-
          --health-cmd "nc -z 127.0.0.1 11211"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # This job never pushes; don't leave the token in the git config
          # (zizmor: artipacked).
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Run memcached integration test
        env:
          # memcached-only, no default features — leanest build.
          CACHEKIT_TEST_MEMCACHED_URL: tcp://localhost:11211
        # Explicit `shell: bash` runs with -o pipefail (see redis-lock).
        shell: bash
        run: |
          cargo test --no-default-features --features memcached --test memcached_tests -- --nocapture 2>&1 | tee memcached-test.log
          # False-green guard: this job exists so the live test actually runs.
          # If it silently skipped (env not seen), fail loudly instead of
          # reporting a hollow green.
          if grep -q "skipping memcached_live_semantics" memcached-test.log; then
            echo "::error::memcached live test skipped — CACHEKIT_TEST_MEMCACHED_URL not seen by the test"
            exit 1
          fi

  wasm:
    name: wasm32 check + runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Must equal the wasm-bindgen version in Cargo.lock — the test runner
      # binary and the crate share a private ABI and mismatches refuse to run.
      # Bump this, the sha256 below, and the Cargo.lock pin together.
      WASM_BINDGEN_VERSION: "0.2.121"
      # Public release-tarball checksum, not a credential.
      WASM_BINDGEN_SHA256: "3039f38f65fe237b640cf06a140c919ca8d717ec5012146d145d3f27bb4d6b28" # pragma: allowlist secret
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Check wasm32 build
        run: cargo check -p cachekit-rs --target wasm32-unknown-unknown --features workers,encryption --no-default-features

      # ── wasm32 runtime tests ────────────────────────────────────────────────
      # Compile-only coverage shipped a runtime trap (SystemTime::now() panics
      # on wasm32) in five consecutive releases. The steps below
      # actually EXECUTE the session/fetch path in a wasm runtime.

      - name: Guard wasm-bindgen lockfile drift
        run: |
          locked=$(cargo pkgid wasm-bindgen | sed 's/.*[@#]//')
          if [ "$locked" != "$WASM_BINDGEN_VERSION" ]; then
            echo "::error::Cargo.lock has wasm-bindgen $locked but this job pins the $WASM_BINDGEN_VERSION test runner. Update WASM_BINDGEN_VERSION + WASM_BINDGEN_SHA256 in ci.yml (and the wasm-bindgen-test pin in crates/cachekit/Cargo.toml) in the same PR."
            exit 1
          fi

      - name: Install Node (wasm-bindgen-test-runner host)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install wasm-bindgen-test-runner
        run: |
          curl -sSfL --retry 3 -o /tmp/wbg.tar.gz \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  /tmp/wbg.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wbg.tar.gz -C /tmp
          mkdir -p "$HOME/.wbg-bin"
          install -m 0755 "/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen-test-runner" "$HOME/.wbg-bin/"
          echo "$HOME/.wbg-bin" >> "$GITHUB_PATH"

      - name: Run wasm32 runtime tests
        # Consumer feature set (bluesky-thinking hotpath) — workers + cachekitio
        # + encryption + macros, no defaults. --test wasm_session_tests: the
        # native integration tests in tests/ don't build for wasm32.
        # Through make, not cargo directly: the target fails the run unless the
        # summary reports every test passed, because the runner can exit 0
        # when a test never completes (see the Makefile).
        run: make test-wasm

  # Instruction counts of the client hot path (`make bench-instr`,
  # examples/bench_hot_path.rs) on every PR, against the commit it merges
  # into. Counts move with the CPU, rustc and valgrind, so nothing committed
  # is compared: this job builds the PR (the merge commit checked out here)
  # and its base side by side and measures both on this runner. A
  # release-please PR is measured against the last release tag instead: it
  # is rebased onto main on every push, so against main it would measure
  # only a version bump. Each tree builds into its own target dir: in a
  # shared one, cargo's mtime check can reuse one tree's build for the other
  # and compare a binary against itself. Both trees build the PR's copy of
  # the example, so both sides run one workload; a PR whose example calls
  # API the base lacks cannot be compared and reads INCOMPLETE. Both build
  # with `--features macros`, so the cases behind it, the `#[cachekit]` path,
  # are measured too.
  perf-ir:
    name: Instruction counts vs base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      # The report reads INCOMPLETE until the gate writes its own over it, so
      # a job that dies before measuring never reads as a pass.
      - name: Start with no verdict
        run: |
          mkdir -p "$RUNNER_TEMP/ir"
          printf '### Instruction counts: INCOMPLETE\n\nThe gate wrote no report: the job stopped before the gate wrote its verdict. See the job log.\n' \
            > "$RUNNER_TEMP/ir/report.md"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2 # the merge commit and its first parent, the base tip

      - name: Pick the base
        id: base
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ $HEAD_REF != release-please--* ]]; then
            sha=$(git rev-parse HEAD^1)
            label="$sha"
          else
            version=$(git show HEAD^1:.release-please-manifest.json | jq -er '."crates/cachekit"') || {
              echo "::error::release PR: no crates/cachekit version in the base's .release-please-manifest.json"
              exit 1
            }
            tag="cachekit-rs-v$version"
            # Never fall back to main: that would measure nothing and pass.
            git fetch --quiet --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag" || {
              echo "::error::release PR: cannot fetch the last release tag $tag"
              exit 1
            }
            sha=$(git rev-parse "$tag^{commit}")
            label="$tag ($sha), the last release"
          fi
          echo "Base: $label"
          {
            echo "sha=$sha"
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the PR and its base
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/ir/head" HEAD
          git worktree add --detach "$RUNNER_TEMP/ir/base" "$BASE_SHA"
          cp "$RUNNER_TEMP/ir/head/crates/cachekit/examples/bench_hot_path.rs" \
            "$RUNNER_TEMP/ir/base/crates/cachekit/examples/bench_hot_path.rs"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: perf-ir
          workspaces: |
            ${{ runner.temp }}/ir/head -> ../head-target
            ${{ runner.temp }}/ir/base -> ../base-target

      - name: Install valgrind
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends valgrind
          valgrind --version

      - name: Build the PR and its base
        env:
          BASE_LABEL: ${{ steps.base.outputs.label }}
        run: |
          (cd "$RUNNER_TEMP/ir/head" && CARGO_TARGET_DIR=../head-target cargo build --locked --release --features macros --example bench_hot_path)
          (cd "$RUNNER_TEMP/ir/base" && CARGO_TARGET_DIR=../base-target cargo build --locked --release --features macros --example bench_hot_path) || {
            {
              echo '### Instruction counts: INCOMPLETE'
              echo
              echo "Not comparable: the PR's \`examples/bench_hot_path.rs\` does not build against the base, $BASE_LABEL. It may call API the base lacks."
            } > "$RUNNER_TEMP/ir/report.md"
            exit 1
          }

      - name: Gate the PR against its base
        run: |
          "$RUNNER_TEMP/ir/head-target/release/examples/bench_hot_path" instr --jobs "$(nproc)" \
            --base "$RUNNER_TEMP/ir/base-target/release/examples/bench_hot_path" --report "$RUNNER_TEMP/ir/report.md"

      # The report for perf-ir-comment, and for the run summary, where a fork
      # PR (which gets no comment) can read it.
      - name: Hand over the report
        id: report
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_LABEL: ${{ steps.base.outputs.label }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/ir/body.md"
          {
            cat "$RUNNER_TEMP/ir/report.md"
            echo
            echo "PR head \`$HEAD_SHA\` merged into its base, measured against \`${BASE_LABEL:-no base}\` on the same runner. [Workflow run]($RUN_URL)"
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "report<<$delimiter"
            cat "$body"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  # perf-ir's report as one PR comment, edited in place on every run. This job
  # holds the write token and never checks out the repository. Fork PRs are
  # skipped: their token cannot write to the PR. It runs even when perf-ir was
  # cancelled, so the comment reads INCOMPLETE rather than keeping an older
  # head's verdict; a run whose head is no longer the PR's head posts nothing,
  # so a slow older run cannot overwrite a newer run's comment. Comment jobs
  # for one head of one PR run one at a time, so two runs of that head cannot
  # both find no comment and each post one. The group names the head because
  # GitHub keeps one pending job per group and cancels it when another
  # queues: keyed by PR alone, an older head's job could cancel the newest
  # head's and then post nothing.
  perf-ir-comment:
    name: Instruction counts comment
    needs: perf-ir
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: perf-ir-comment-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    permissions:
      pull-requests: write # enough for a PR's issue comments
    steps:
      - name: Post or update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ needs.perf-ir.outputs.report }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          if [[ $current != "$HEAD_SHA" ]]; then
            echo "The PR head moved to $current; the run for that head owns the comment."
            exit 0
          fi
          if [[ -z $REPORT ]]; then
            REPORT=$(printf '### Instruction counts: INCOMPLETE\n\nThe gate job handed over no report. [Workflow run](%s)' "$RUN_URL")
          fi
          # Only the bot's own comment that opens with the marker is edited.
          marker='<!-- cachekit-instruction-counts -->'
          body=$(printf '%s\n%s\n' "$marker" "$REPORT")
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [[ -n $id ]]; then
            jq -n --arg body "$body" '{body: $body}' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" --input - > /dev/null
          else
            jq -n --arg body "$body" '{body: $body}' | gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --input - > /dev/null
          fi
